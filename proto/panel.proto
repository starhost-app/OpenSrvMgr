// Example-only Panel callback contract for OpenSrvMgr.
// This file is not compiled or used by the OpenSrvMgr node binary.
// A separate Panel service can implement these RPCs in any language.
//
// Authentication: OpenSrvMgr sends `authorization: Bearer <panel-key>` on every
// Panel RPC. The Panel must validate this metadata before responding.

syntax = "proto3";
package opensrvmgr;

message Empty {}
message Env { string key = 1; string value = 2; }
message Port { string ip = 1; uint32 port = 2; }
message Limits {
  int64 memory_bytes = 1;
  int64 swap_bytes = 2;
  int64 nano_cpus = 3;
  int64 pids_limit = 4;
  int64 disk_bytes = 5;
  int32 io_weight = 6;
}
message SftpUser {
  string username = 1;
  string password_hash = 2;
  bool read_only = 3;
}
message Uuid { string uuid = 1; }
message ServerConfig {
  bool exists = 1;
  string image = 2;
  string cmd = 3;
  repeated Env env = 4;
  // Optional. An empty list means the server has no published ports.
  repeated Port ports = 5;
  Limits limits = 6;
  string stop_command = 7;
  uint32 timeout_sec = 8;
  bool auto_restart = 9;
  repeated SftpUser sftp_users = 10;
}
message TemplateConfig {
  bool exists = 1;
  string image = 2;
  string entrypoint = 3;
  string script = 4;
  repeated Env env = 5;
  int64 memory_bytes = 6;
}
message Event {
  string uuid = 1;
  string event = 2;
  int32 exit_code = 3;
  bool oom_killed = 4;
  int64 timestamp_unix = 5;
}

service Panel {
  rpc GetServerConfig(Uuid) returns (ServerConfig);
  rpc GetTemplateConfig(Uuid) returns (TemplateConfig);
  rpc ReportContainerEvent(Event) returns (Empty);
}
